<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no'>
<title>Pepe VPN</title>
<script src='https://telegram.org/js/telegram-web-app.js'></script>
<style>
:root {
  --accent: #22c55e;
  --accent-2: #4ade80;
  --accent-3: #86efac;
  --accent-text: #052e16;
  --bg: #07140b;
  --surface: rgba(8, 40, 20, 0.78);
  --surface-solid: #0d2918;
  --text: #f0fdf4;
  --text-secondary: #86a88f;
  --border: rgba(74, 222, 128, 0.12);
  --radius: 18px;
  --radius-sm: 14px;
  --radius-xs: 10px;
  --shadow: 0 12px 32px rgba(0,0,0,0.35);
  --gradient: linear-gradient(135deg, #14532d 0%, #22c55e 55%, #4ade80 100%);
  --gradient-soft: linear-gradient(135deg, rgba(20,83,45,0.35) 0%, rgba(34,197,94,0.16) 100%);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex; flex-direction: column; overflow: hidden;
}
#bg {
  position: fixed; inset: 0; z-index: -3;
  background:
    radial-gradient(ellipse at 15% 0%, rgba(34,197,94,0.12) 0%, transparent 42%),
    radial-gradient(ellipse at 85% 20%, rgba(74,222,128,0.08) 0%, transparent 40%),
    radial-gradient(ellipse at 50% 100%, rgba(34,197,94,0.08) 0%, transparent 45%),
    #07140b;
}
.lines {
  position: fixed; inset: 0; z-index: -2;
  overflow: hidden;
  transform: translate3d(0,0,0) rotate(0deg);
  transition: transform .9s cubic-bezier(0.22, 1, 0.36, 1);
}
.lines.shift { transform: translate3d(var(--dx, 0), var(--dy, 0), 0) rotate(var(--rot, 0deg)); }
.line {
  position: absolute; height: 2px;
  background: linear-gradient(90deg, transparent 0%, rgba(74,222,128,0.45) 50%, transparent 100%);
  box-shadow: 0 0 10px rgba(74,222,128,0.35);
  filter: blur(1px);
  animation: lineFlow 7s linear infinite;
  opacity: .7;
}
@keyframes lineFlow {
  0% { transform: translateX(-200%); opacity: .25; }
  50% { opacity: .95; }
  100% { transform: translateX(200%); opacity: .25; }
}
#app { display: flex; flex-direction: column; height: 100%; position: relative; }
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
  display: flex; align-items: center; justify-content: space-between; pointer-events: none;
}
header .back, header .support {
  pointer-events: auto; background: var(--surface); border: 1px solid var(--border); color: var(--text);
  width: 36px; height: 36px; border-radius: 50%; cursor: pointer; padding: 0;
  display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px);
}
header .back { opacity: 0; visibility: hidden; transition: opacity .2s; }
header .back.visible { opacity: 1; visibility: visible; }
header .title { display: none; }
main { flex: 1; overflow-y: auto; padding: 60px 14px 90px; }
.page { display: none; }
.page.active { display: block; animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); backdrop-filter: blur(10px);
}
.card-title { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600; letter-spacing: .2px; }
.big-value { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
.btn { display: block; width: 100%; padding: 12px; border: none; border-radius: var(--radius-sm);
  background: var(--gradient); color: var(--accent-text); font-size: 14px; font-weight: 700;
  cursor: pointer; margin-top: 10px; text-align: center; transition: opacity .15s, transform .1s, box-shadow .2s;
  text-decoration: none; box-shadow: 0 6px 18px rgba(34,197,94,0.18);
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); box-shadow: none; font-weight: 600; }
.btn-ghost { background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--border); box-shadow: none; font-weight: 600; }
.btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
input, select { width: 100%; padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: rgba(0,0,0,0.25); color: var(--text); font-size: 14px; outline: none; margin-bottom: 10px; -webkit-appearance: none; }
label { display: block; color: var(--text-secondary); font-size: 12px; margin: 10px 0 5px; font-weight: 600; }
.list-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: transform .1s; box-shadow: var(--shadow); }
.list-item:active { transform: scale(0.99); }
.list-item .info { flex: 1; }
.list-item .title { font-weight: 600; font-size: 14px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.list-item .subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
.list-item .arrow { color: var(--text-secondary); font-size: 18px; font-weight: 300; }
.status-badge { display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; border: 1px solid transparent; }
.status-active { background: rgba(34,197,94,.15); color: #4ade80; border-color: rgba(74,222,128,.25); }
.status-expired { background: rgba(248,113,113,.12); color: #f87171; border-color: rgba(248,113,113,.2); }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(7,20,11,0.88); backdrop-filter: blur(20px) saturate(180%); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); z-index: 100; }
.bottom-nav button { background: none; border: none; color: var(--text-secondary); font-size: 10px; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; transition: all .2s; border-radius: 14px; padding: 5px 0; margin: 0 4px; }
.bottom-nav button.active { background: var(--gradient-soft); color: #fff; border: 1px solid var(--border); }
.bottom-nav .icon { width: 20px; height: 20px; }
.hero { text-align: left; padding: 6px 2px 12px; }
.hero h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.4px; }
.hero p { color: var(--text-secondary); margin: 4px 0 0; font-size: 13px; }
.quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.code-block { background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; word-break: break-all; font-size: 12px; margin: 8px 0; color: var(--text); cursor: pointer; }
.qr-wrap { text-align: center; margin: 12px 0; }
.qr-wrap img { max-width: 180px; border-radius: 14px; background: #fff; padding: 8px; }
.copy-row { display: flex; gap: 8px; align-items: center; }
.copy-row input { flex: 1; margin: 0; }
.copy-row button { padding: 10px 14px; border: none; border-radius: var(--radius-sm); background: var(--gradient); color: var(--accent-text); cursor: pointer; box-shadow: 0 4px 14px rgba(34,197,94,0.2); }
.empty { text-align: center; color: var(--text-secondary); padding: 40px 20px; font-size: 14px; }
.link { color: #86efac; text-decoration: none; cursor: pointer; }
.toast { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(13,41,24,0.96); color: #fff; padding: 10px 18px; border-radius: 24px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 200; border: 1px solid var(--border); }
.toast.show { opacity: 1; }
#loading { text-align: center; color: var(--text-secondary); padding: 60px 20px; font-size: 14px; }
.icon-inline { width: 16px; height: 16px; vertical-align: middle; margin-right: 5px; }
.icon-btn { width: 18px; height: 18px; vertical-align: middle; margin-right: 6px; }
.section-label { font-size: 12px; font-weight: 600; color: var(--text-secondary); margin: 18px 0 8px; padding-left: 4px; }
.stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.stat-row:last-child { border-bottom: none; }
.stat-row span { color: var(--text-secondary); }
.stat-row code, .stat-row b { color: var(--text); font-weight: 700; }
.support-row { display: flex; gap: 10px; margin-top: 10px; }
.support-row a { flex: 1; }
.gradient-text { background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat-card { text-align: center; margin-bottom: 0; padding: 14px; }
.stat-card .card-title { margin-bottom: 4px; }
.stat-card .big-value { font-size: 26px; }
.progress { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; margin-top: 6px; }
.progress > div { height: 100%; background: var(--gradient); border-radius: 3px; }
.badge { display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; background: var(--gradient-soft); color: #bbf7d0; border: 1px solid var(--border); }
.balance-card .big-value { margin: 2px 0 6px; }
.device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.device-card { text-align: center; padding: 16px 10px; cursor: pointer; transition: transform .1s; }
.device-card:active { transform: scale(0.98); }
.device-icon { width: 40px; height: 40px; margin: 0 auto 10px; border-radius: 14px; background: var(--gradient-soft); display: flex; align-items: center; justify-content: center; color: var(--accent-2); }
.device-name { font-weight: 700; font-size: 14px; margin-bottom: 8px; }
.app-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.app-link { display: flex; align-items: center; justify-content: space-between; background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: var(--radius-xs); padding: 10px 12px; font-size: 13px; color: var(--text); text-decoration: none; cursor: pointer; transition: background .15s; }
.app-link:active { background: rgba(255,255,255,0.08); }
.app-link span { color: var(--text-secondary); font-size: 11px; }
.dl-icon { color: var(--accent-2); font-size: 14px; }
.sub-info { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sub-days { font-size: 28px; font-weight: 800; color: var(--accent-2); text-align: right; }
.sub-days span { display: block; font-size: 11px; color: var(--text-secondary); font-weight: 500; }
</style>
</head>
<body>
<div id='bg'></div>
<div class='lines' id='lines'></div>
<div id='app'>
  <header>
    <button class='back' id='backBtn' aria-label='Back'>
      <svg width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M15 18l-6-6 6-6'/></svg>
    </button>
    <span class='title' id='pageTitle'>Pepe VPN</span>
    <button class='support' id='headerSupport' aria-label='Support'>
      <svg width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5a8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z'/></svg>
    </button>
  </header>
  <main id='main'><div id='loading' class='empty'>Загрузка...</div></main>
</div>
<nav class='bottom-nav' id='nav'>
  <button data-page='home' class='active'>
    <svg class='icon' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/><polyline points='9 22 9 12 15 12 15 22'/></svg>
    <span>Главная</span>
  </button>
  <button data-page='subs'>
    <svg class='icon' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><rect x='5' y='2' width='14' height='20' rx='2' ry='2'/><line x1='12' y1='18' x2='12.01' y2='18'/></svg>
    <span>Подписки</span>
  </button>
  <button data-page='store'>
    <svg class='icon' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z'/><line x1='3' y1='6' x2='21' y2='6'/><path d='M16 10a4 4 0 0 1-8 0'/></svg>
    <span>Магазин</span>
  </button>
  <button data-page='devices'>
    <svg class='icon' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='3' width='20' height='14' rx='2' ry='2'/><line x1='8' y1='21' x2='16' y2='21'/><line x1='12' y1='17' x2='12' y2='21'/></svg>
    <span>Подключить</span>
  </button>
  <button data-page='profile'>
    <svg class='icon' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'/><circle cx='12' cy='7' r='4'/></svg>
    <span>Профиль</span>
  </button>
</nav>
<div class='toast' id='toast'></div>

<script>
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : {};
if (tg.ready) tg.ready();
if (tg.expand) tg.expand();
const API_BASE = '/mini-app/api';
let state = { user: null, subscriptions: [], plans: [], referrals: {}, config: {}, isAdmin: false, page: 'home', stack: [], selectedSub: null, selectedDevice: null, selectedMyDevice: null };

function $(id){ return document.getElementById(id); }
function showToast(text){ const t=$('toast'); t.textContent=text; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
function copy(text){ navigator.clipboard.writeText(text).then(()=>showToast('Скопировано')).catch(()=>showToast('Не удалось скопировать')); }
function initDataRaw(){
  if (tg.initData) return tg.initData;
  const qs = new URLSearchParams(window.location.search).get('tgWebAppData');
  if (qs) return qs;
  const hash = new URLSearchParams(window.location.hash.slice(1)).get('tgWebAppData');
  if (hash) return hash;
  return '';
}

async function api(path, method='GET', body){
  const raw = initDataRaw();
  const sep = path.includes('?') ? '&' : '?';
  const url = API_BASE + path + sep + 'init_data=' + encodeURIComponent(raw);
  const opts = { method, headers: { 'Accept': 'application/json', 'X-Telegram-Init-Data': raw } };
  if (method !== 'GET') {
    if (!body) body = {};
    body.init_data = raw;
  }
  if (body) { opts.headers['Content-Type']='application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(url, opts);
  if (r.status===401) { render('auth-error'); throw new Error('auth'); }
  if (!r.ok) { const txt = await r.text(); throw new Error(txt); }
  return r.json();
}

function fmtMoney(n){ return Number(n).toFixed(2); }
function fmtDate(ts){ if(!ts) return '-'; const d=new Date(ts*1000); return d.toLocaleDateString('ru-RU'); }
function daysLeft(ts){ const d=Math.ceil((ts*1000-Date.now())/86400000); return d>0?d+' дн.':'истекла'; }
function fmtDateTime(ts){ if(!ts) return '-'; const d=new Date(ts*1000); return d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function shiftLines(){
  const el = $('lines');
  const dx = (Math.random()*100 - 50).toFixed(0) + 'px';
  const dy = (Math.random()*60 - 30).toFixed(0) + 'px';
  const rot = (Math.random()*8 - 4).toFixed(1) + 'deg';
  el.style.setProperty('--dx', dx);
  el.style.setProperty('--dy', dy);
  el.style.setProperty('--rot', rot);
  el.classList.add('shift');
  setTimeout(()=>el.classList.remove('shift'), 900);
}

function render(pageId, push=true){
  if (push && state.page !== pageId) state.stack.push(state.page);
  if (state.page !== pageId) shiftLines();
  state.page = pageId;
  $('backBtn').classList.toggle('visible', state.stack.length > 0);
  const main = $('main');
  if (pageId === 'home') renderHome(main);
  else if (pageId === 'subs') renderSubs(main);
  else if (pageId === 'sub-detail') renderSubDetail(main);
  else if (pageId === 'store') renderStore(main);
  else if (pageId === 'devices') renderDevices(main);
  else if (pageId === 'device-detail') renderDeviceDetail(main);
  else if (pageId === 'sub-devices') renderSubDevices(main);
  else if (pageId === 'my-device-detail') renderMyDeviceDetail(main);
  else if (pageId === 'refs') renderRefs(main);
  else if (pageId === 'profile') renderProfile(main);
  else if (pageId === 'deposit') renderDeposit(main);
  else if (pageId === 'admin') renderAdmin(main);
  else if (pageId === 'auth-error') main.innerHTML = '<div class="empty">Не удалось авторизоваться. Откройте приложение из Telegram.</div>';
  main.scrollTop = 0;
  updateNav();
}

function updateNav(){
  let active = state.page;
  if (active === 'device-detail' || active === 'sub-devices' || active === 'my-device-detail') active = 'subs';
  if (active === 'device-detail') active = 'devices';
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active', b.dataset.page===active));
}

function icon(name, cls){
  const svgs = {
    copy: `<rect x='9' y='9' width='13' height='13' rx='2' ry='2'/><path d='M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1'/>`,
    support: `<path d='M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5a8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z'/>`,
    bot: `<rect x='2' y='2' width='20' height='20' rx='5' ry='5'/><path d='M8 12h8'/><path d='M12 8v8'/>`,
    qr: `<rect x='3' y='3' width='7' height='7'/><rect x='14' y='3' width='7' height='7'/><rect x='14' y='14' width='7' height='7'/><rect x='3' y='14' width='7' height='7'/>`,
    share: `<circle cx='18' cy='5' r='3'/><circle cx='6' cy='12' r='3'/><circle cx='18' cy='19' r='3'/><line x1='8.59' y1='13.51' x2='15.42' y2='17.49'/><line x1='15.41' y1='6.51' x2='8.59' y2='10.49'/>`,
    renew: `<path d='M23 4v6h-6'/><path d='M1 20v-6h6'/><path d='M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15'/>`,
    wallet: `<path d='M1 7V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v2'/><path d='M1 7h20v10a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7z'/><path d='M16 11h2'/>`,
    bag: `<path d='M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z'/><line x1='3' y1='6' x2='21' y2='6'/><path d='M16 10a4 4 0 0 1-8 0'/>`,
    phone: `<rect x='5' y='2' width='14' height='20' rx='2' ry='2'/><line x1='12' y1='18' x2='12.01' y2='18'/>`,
    people: `<path d='M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2'/><circle cx='9' cy='7' r='4'/><path d='M23 21v-2a4 4 0 0 0-3-3.87'/><path d='M16 3.13a4 4 0 0 1 0 7.75'/>`,
    user: `<path d='M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2'/><circle cx='12' cy='7' r='4'/>`,

function homeSubInfo(){

async function doDeposit(method, asset){
  const amount = parseInt($('depAmount').value); if(!amount||amount<10){ showToast('Введите сумму от 10 ₽'); return; }
  if (method === 'crypto') { const el = $('cryptoOpts'); el.style.display = el.style.display === 'none' ? 'block' : 'none'; return; }
  try {
    const res = await api('/deposit', 'POST', { method, amount, asset });
    if (res.payment_url) {
      if (method==='stars') tg.openInvoice(res.payment_url, (status)=>{ if(status==='paid'){ showToast('Оплачено'); loadMe(); }});
      else if (res.payment_url.startsWith('https://t.me/')) tg.openTelegramLink(res.payment_url);
      else tg.openLink(res.payment_url, {try_instant_view: false});
    } else { showToast(res.error||'Не удалось создать платёж'); }
  } catch(e){ showToast(e.message||'Ошибка'); }
}

    `</div>` +
    `<button class='btn' data-action='support'>` + icon('support','icon-btn') + `Написать в поддержку</button>` +
    (state.isAdmin ? `<button class='btn btn-outline' data-page='admin'>Админ-панель</button>` : ``);
}

async function renderAdmin(main){
  $('pageTitle').textContent = '';
  try {
    const data = await api('/metrics');
    main.innerHTML = `` +
      `<div class='card'><div class='card-title'>Метрики</div>` +
        `<div class='stat-row'><span>Пользователей</span><b>` + data.users_total + `</b></div>` +
        `<div class='stat-row'><span>Активных подписок</span><b>` + data.subscriptions_active + `</b></div>` +
        `<div class='stat-row'><span>MRR</span><b>` + fmtMoney(data.mrr_rub) + ` ₽</b></div>` +
        `<div class='stat-row'><span>Выручка</span><b>` + fmtMoney(data.revenue_total_rub) + ` ₽</b></div>` +
        `<div class='stat-row'><span>Онлайн</span><b>` + data.online_now + `</b></div>` +
      `</div>`;
  } catch(e){ main.innerHTML = `<div class='empty'>Нет доступа</div>`; }
}

function openSupport(){
  const s = state.config.support || state.config.support_id;
  if (!s) { showToast('Поддержка не настроена'); return; }
  if (/^\d+$/.test(s)) tg.openTelegramLink('tg://user?id=' + s);
  else if (s.startsWith('@')) tg.openTelegramLink('https://t.me/' + s.slice(1));
  else if (s.startsWith('http://') || s.startsWith('https://')) tg.openTelegramLink(s);
  else tg.openTelegramLink('https://t.me/' + s);
}

function handleMainClick(e){
  const target = e.target;
  const page = target.closest('[data-page]');
  if (page) { const p = page.dataset.page; if (p==='home'){ state.stack=[]; render('home', false); } else { state.stack=[]; render(p, false); } return; }
  const sub = target.closest('[data-sub]');
  if (sub) { showSub(sub.dataset.sub); return; }
  const copyBtn = target.closest('.copy-btn, [data-copy]');
  if (copyBtn) { const text = copyBtn.dataset.copy || ''; if(text) copy(text); else showToast('Нечего копировать'); return; }
  const planBtn = target.closest('[data-plan]');
  if (planBtn) { buyPlan(planBtn.dataset.plan); return; }
  const renewBtn = target.closest('[data-renew]');
  if (renewBtn) { state.selectedSub = state.subscriptions.find(s=>s.sub_id===renewBtn.dataset.renew); renewSubPrompt(renewBtn.dataset.renew); return; }
  const amountBtn = target.closest('[data-amount]');
  if (amountBtn) { $('depAmount').value = amountBtn.dataset.amount; return; }
  const payBtn = target.closest('[data-method]');
  if (payBtn) { doDeposit(payBtn.dataset.method, payBtn.dataset.asset||''); return; }
  const supportBtn = target.closest('[data-action="support"]');
  if (supportBtn) { openSupport(); return; }
  const deviceBtn = target.closest('[data-device]');
  if (deviceBtn) { state.selectedDevice = deviceBtn.dataset.device; render('device-detail'); return; }
  const subDevicesBtn = target.closest('[data-sub-devices]');
  if (subDevicesBtn) { state.selectedSub = state.subscriptions.find(s=>s.sub_id===subDevicesBtn.dataset.subDevices); render('sub-devices'); return; }
  const myDeviceBtn = target.closest('[data-my-device]');
  if (myDeviceBtn) { state.selectedMyDevice = parseInt(myDeviceBtn.dataset.myDevice); render('my-device-detail'); return; }
  const unbindBtn = target.closest('[data-unbind]');
  if (unbindBtn) { unbindDevice(unbindBtn.dataset.unbind); return; }
  const openLinkBtn = target.closest('[data-open-link]');
  if (openLinkBtn) { tg.openLink(openLinkBtn.dataset.openLink, {try_instant_view: false}); return; }
}

async function unbindDevice(key){
  const [sub_id, index] = key.split(':');
  try {
    const res = await api('/unbind-device', 'POST', { sub_id, index: parseInt(index) });
    if (res.ok){ showToast('Устройство отвязано'); await loadMe(); render('sub-devices'); }
    else showToast(res.message||'Ошибка');
  } catch(e){ showToast(e.message||'Ошибка'); }
}

async function loadMe(){
  try {
    const data = await api('/me');
    state.user = data.user;
    state.subscriptions = data.subscriptions;
    state.plans = data.plans;
    state.referrals = data.referrals;
    state.isAdmin = data.is_admin;
  } catch(e){ console.error(e); render('auth-error'); throw e; }
}

async function loadConfig(){
  try { state.config = await api('/config'); } catch(e){ state.config = {}; }
}

function buildLines(){
  const el = $('lines');
  el.innerHTML = '';
  for (let i=0;i<16;i++){
    const line = document.createElement('div');
    line.className = 'line';
    line.style.top = (i*6.5 + 3) + '%';
    line.style.width = (35 + Math.random()*55) + '%';
    line.style.left = (Math.random()*45) + '%';
    line.style.animationDuration = (6 + Math.random()*7) + 's';
    line.style.animationDelay = (Math.random()*-8) + 's';
    line.style.opacity = (0.25 + Math.random()*0.55).toFixed(2);
    el.appendChild(line);
  }
}

async function init(){
  if (tg.setHeaderColor) tg.setHeaderColor('#07140b');
  if (tg.setBackgroundColor) tg.setBackgroundColor('#07140b');
  buildLines();
  if (!initDataRaw()) { render('auth-error', false); return; }
  await loadConfig();
  await loadMe();
  render('home', false);
  $('backBtn').onclick = ()=>{ state.stack.pop(); const prev = state.stack.pop() || 'home'; render(prev, false); };
  document.getElementById('main').onclick = handleMainClick;
  document.getElementById('nav').onclick = (e)=>{
    const b = e.target.closest('button'); if(!b) return; state.stack=[]; render(b.dataset.page, false);
  };
  const hs = document.getElementById('headerSupport'); if(hs) hs.onclick = openSupport;
}

init().catch((e)=>{
  console.error(e);
  if (!initDataRaw() || (e && e.message === 'auth')) render('auth-error', false);
  else $('main').innerHTML = `<div class='empty'>Ошибка загрузки. Попробуйте позже.</div>`;
});
</script>
</body>
</html>
