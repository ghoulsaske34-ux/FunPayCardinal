<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VPN — Личный кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --accent: var(--tg-theme-button-color, #3390ec);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --bg: var(--tg-theme-bg-color, #ffffff);
  --secondary-bg: var(--tg-theme-secondary-bg-color, #f5f5f5);
  --text: var(--tg-theme-text-color, #000000);
  --hint: var(--tg-theme-hint-color, #8c8c8c);
  --link: var(--tg-theme-link-color, #3390ec);
  --danger: #ff3b30;
  --success: #34c759;
  --radius: 14px;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex; flex-direction: column; overflow: hidden;
}
#app { display: flex; flex-direction: column; height: 100%; }
header {
  padding: 16px; text-align: center; font-weight: 700; font-size: 18px;
  background: var(--bg); border-bottom: 1px solid var(--secondary-bg);
  position: relative; flex-shrink: 0;
}
header .back {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--link); font-size: 24px; cursor: pointer;
  display: none;
}
main { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 80px; }
.page { display: none; }
.page.active { display: block; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.card {
  background: var(--secondary-bg); border-radius: var(--radius); padding: 16px;
  margin-bottom: 12px; box-shadow: var(--shadow);
}
.card-title { font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--hint); margin-bottom: 8px; }
.big-value { font-size: 32px; font-weight: 700; }
.btn {
  display: block; width: 100%; padding: 14px; border: none; border-radius: 10px;
  background: var(--accent); color: var(--accent-text); font-size: 16px; font-weight: 600;
  cursor: pointer; margin-top: 10px; text-align: center;
}
.btn:disabled { opacity: .6; cursor: not-allowed; }
.btn-outline {
  background: transparent; color: var(--accent); border: 1px solid var(--accent);
}
.btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
input, select {
  width: 100%; padding: 14px; border-radius: 10px; border: none;
  background: var(--secondary-bg); color: var(--text); font-size: 16px; outline: none;
  margin-bottom: 10px;
}
label { display: block; color: var(--hint); font-size: 13px; margin: 10px 0 4px; }
.list-item {
  background: var(--secondary-bg); border-radius: var(--radius); padding: 14px;
  margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; transition: transform .1s;
}
.list-item:active { transform: scale(.99); }
.list-item .info { flex: 1; }
.list-item .title { font-weight: 600; }
.list-item .subtitle { font-size: 13px; color: var(--hint); margin-top: 3px; }
.list-item .arrow { color: var(--hint); font-size: 18px; }
.status-badge {
  display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px;
  font-weight: 600; margin-left: 8px;
}
.status-active { background: rgba(52,199,89,.15); color: var(--success); }
.status-expired { background: rgba(255,59,48,.15); color: var(--danger); }
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg); border-top: 1px solid var(--secondary-bg);
  display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  z-index: 100;
}
.bottom-nav button {
  background: none; border: none; color: var(--hint); font-size: 11px; flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
}
.bottom-nav button.active { color: var(--accent); }
.bottom-nav .icon { font-size: 22px; }
.hero { text-align: center; padding: 30px 10px; }
.hero h1 { margin: 0; font-size: 22px; }
.hero p { color: var(--hint); margin: 6px 0 0; }
.quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.code-block {
  background: var(--bg); border-radius: 10px; padding: 10px; font-family: monospace;
  word-break: break-all; font-size: 13px; margin: 8px 0; border: 1px solid rgba(128,128,128,.2);
}
.qr-wrap { text-align: center; margin: 12px 0; }
.qr-wrap img { max-width: 220px; border-radius: 12px; background: #fff; padding: 8px; }
.copy-row { display: flex; gap: 8px; align-items: center; }
.copy-row input { flex: 1; margin: 0; }
.copy-row button { padding: 12px 16px; border: none; border-radius: 10px; background: var(--accent); color: var(--accent-text); }
.empty { text-align: center; color: var(--hint); padding: 40px 20px; }
.link { color: var(--link); text-decoration: none; }
.toast {
  position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.85); color: #fff; padding: 10px 20px; border-radius: 20px;
  font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 200;
}
.toast.show { opacity: 1; }
#loading { text-align: center; color: var(--hint); padding: 40px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="back" id="backBtn">←</button>
    <span id="pageTitle">VPN</span>
  </header>
  <main id="main"></main>
</div>
<nav class="bottom-nav" id="nav">
  <button data-page="home" class="active"><span class="icon">🏠</span><span>Главная</span></button>
  <button data-page="subs"><span class="icon">📱</span><span>Подписки</span></button>
  <button data-page="store"><span class="icon">🛒</span><span>Магазин</span></button>
  <button data-page="refs"><span class="icon">👥</span><span>Рефералы</span></button>
  <button data-page="profile"><span class="icon">👤</span><span>Профиль</span></button>
</nav>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();
const API_BASE = '/mini-app/api';
let state = { user: null, subscriptions: [], plans: [], referrals: {}, config: {}, isAdmin: false, page: 'home', stack: [] };

function $(id){ return document.getElementById(id); }
function showToast(text){ const t=$('toast'); t.textContent=text; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
function copy(text){ navigator.clipboard.writeText(text).then(()=>showToast('Скопировано!')).catch(()=>showToast('Не удалось скопировать')); }

function initData(){
  return encodeURIComponent(tg.initData || '');
}

async function api(path, method='GET', body){
  const sep = path.includes('?') ? '&' : '?';
  const url = `${API_BASE}${path}${sep}init_data=${initData()}`;
  const opts = { method, headers: { 'Accept': 'application/json' } };
  if (body) { opts.headers['Content-Type']='application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(url, opts);
  if (r.status===401) { render('auth-error'); throw new Error('auth'); }
  if (!r.ok) { const txt = await r.text(); throw new Error(txt); }
  return r.json();
}

function fmtMoney(n){ return Number(n).toFixed(2); }
function fmtDate(ts){ if(!ts) return '-'; const d=new Date(ts*1000); return d.toLocaleDateString('ru-RU'); }
function daysLeft(ts){ const d=Math.ceil((ts*1000-Date.now())/86400000); return d>0?d+' дн.':'истекла'; }

function render(pageId, push=true){
  if (push && state.page !== pageId) state.stack.push(state.page);
  state.page = pageId;
  $('backBtn').style.display = state.stack.length > 0 ? 'block' : 'none';
  const main = $('main');
  if (pageId === 'home') renderHome(main);
  else if (pageId === 'subs') renderSubs(main);
  else if (pageId === 'sub-detail') renderSubDetail(main);
  else if (pageId === 'store') renderStore(main);
  else if (pageId === 'refs') renderRefs(main);
  else if (pageId === 'profile') renderProfile(main);
  else if (pageId === 'deposit') renderDeposit(main);
  else if (pageId === 'admin') renderAdmin(main);
  else if (pageId === 'auth-error') main.innerHTML = '<div class="empty">Не удалось авторизоваться. Откройте приложение из Telegram.</div>';
  updateNav();
}

function updateNav(){
  document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active', b.dataset.page===state.page));
}

function renderHome(main){
  $('pageTitle').textContent = 'VPN';
  const active = state.subscriptions.filter(s=>s.active && s.expires_at*1000>Date.now()).length;
  const u = state.user || {};
  main.innerHTML = `
    <div class="hero">
      <h1>Привет${u.username?', '+u.username:''}</h1>
      <p>Твой персональный VPN-кабинет</p>
    </div>
    <div class="card" style="text-align:center;">
      <div class="card-title">Баланс</div>
      <div class="big-value">${fmtMoney(u.balance||0)} ₽</div>
      <div class="btn-group">
        <button class="btn" onclick="render('deposit')">Пополнить</button>
        <button class="btn btn-outline" onclick="render('store')">Купить VPN</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Активные подписки</div>
      <div style="font-size:28px;font-weight:700;">${active}</div>
      ${active?`<button class="btn btn-outline" onclick="render('subs')">Управлять</button>`:'<p style="color:var(--hint)">Нет активных подписок. <a class="link" onclick="render('store')">Купить</a></p>'}
    </div>
    <div class="quick-actions">
      <button class="btn btn-outline" onclick="render('refs')">Рефералы</button>
      <button class="btn btn-outline" onclick="openSupport()">Поддержка</button>
    </div>
  `;
}

function renderSubs(main){
  $('pageTitle').textContent = 'Мои подписки';
  if (!state.subscriptions.length) { main.innerHTML = '<div class="empty">У вас нет подписок. <a class="link" onclick="render(\'store\')">Купить</a></div>'; return; }
  main.innerHTML = state.subscriptions.map(s=>{
    const active = s.active && s.expires_at*1000>Date.now();
    return `<div class="list-item" onclick="showSub('${s.sub_id}')">
      <div class="info">
        <div class="title">${s.plan_name||s.plan_id} <span class="status-badge ${active?'status-active':'status-expired'}">${active?'Активна':'Истекла'}</span></div>
        <div class="subtitle">До ${fmtDate(s.expires_at)} · ${daysLeft(s.expires_at)} · ${s.devices_count||0} устр.</div>
      </div>
      <div class="arrow">›</div>
    </div>`;
  }).join('');
}

function showSub(id){ state.selectedSub = state.subscriptions.find(s=>s.sub_id===id); render('sub-detail'); }

function renderSubDetail(main){
  $('pageTitle').textContent = 'Подписка';
  const s = state.selectedSub; if(!s){ render('subs'); return; }
  const active = s.active && s.expires_at*1000>Date.now();
  main.innerHTML = `
    <div class="card">
      <div class="card-title">${s.plan_name||s.plan_id}</div>
      <p>Статус: <span class="status-badge ${active?'status-active':'status-expired'}">${active?'Активна':'Истекла'}</span></p>
      <p>Действует до: <b>${fmtDate(s.expires_at)}</b></p>
      <p>Осталось: ${daysLeft(s.expires_at)}</p>
      <p>Устройств: ${s.devices_count||0} / ${s.max_devices||'?'}</p>
    </div>
    <div class="card">
      <div class="card-title">Подписка</div>
      <p style="font-size:13px;color:var(--hint);margin:0 0 8px 0">Добавьте ссылку в приложение (v2rayNG, V2Box, Streisand, sing-box, Clash Meta).</p>
      <input value="${s.sub_url||''}" readonly onclick="copy(this.value)">
      <div class="btn-group">
        <button class="btn btn-outline" onclick="copy('${s.singbox_url||''}')">sing-box</button>
        <button class="btn btn-outline" onclick="copy('${s.clash_url||''}')">Clash Meta</button>
      </div>
    </div>
    ${active?`<button class="btn" onclick="renewSubPrompt('${s.sub_id}')">Продлить</button>`:''}
  `;
}

async function renewSubPrompt(id){
  const months = prompt('На сколько месяцев продлить? (1,3,6,12):', '1'); if(!months) return;
  try {
    await api('/purchase', 'POST', { plan_id: state.selectedSub.plan_id, months: parseInt(months) });
    showToast('Подписка продлена'); await loadMe(); render('subs');
  } catch(e){ showToast(e.message||'Ошибка'); }
}

function renderStore(main){
  $('pageTitle').textContent = 'Магазин';
  if (!state.plans.length) { main.innerHTML = '<div class="empty">Тарифы не настроены.</div>'; return; }
  main.innerHTML = state.plans.map(p=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:18px;font-weight:700;">${p.name}</div>
        <div style="color:var(--hint);font-size:13px;">${p.device_text}</div>
      </div>
      <label>Срок</label>
      <select id="dur-${p.id}">${Object.entries(p.prices).map(([m,price])=>`<option value="${m}">${m} мес. — ${price} ₽</option>`).join('')}</select>
      <button class="btn" onclick="buy('${p.id}')">Купить / Оформить</button>
    </div>
  `).join('');
}

async function buy(planId){
  const months = parseInt($('dur-'+planId).value);
  try {
    const res = await api('/purchase', 'POST', { plan_id: planId, months });
    if (res.ok) { showToast('Подписка оформлена!'); await loadMe(); render('subs'); }
    else if (res.need_payment) { showToast('Недостаточно средств. Пополните баланс.'); render('deposit'); }
  } catch(e){ showToast(e.message||'Ошибка'); }
}

function renderDeposit(main){
  $('pageTitle').textContent = 'Пополнение';
  main.innerHTML = `
    <div class="card">
      <div class="card-title">Сумма пополнения</div>
      <input type="number" id="depAmount" placeholder="100" value="200">
      <div class="btn-group">
        <button class="btn" onclick="setDep(100)">100 ₽</button>
        <button class="btn" onclick="setDep(500)">500 ₽</button>
        <button class="btn" onclick="setDep(1000)">1000 ₽</button>
        <button class="btn" onclick="setDep(2000)">2000 ₽</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Способ оплаты</div>
      <button class="btn" onclick="doDeposit('yookassa')">💳 YooKassa (карта/СБП)</button>
      <button class="btn" onclick="doDeposit('cryptobot','USDT')">💵 CryptoBot USDT</button>
      <button class="btn" onclick="doDeposit('cryptobot','TON')">🌐 CryptoBot TON</button>
      <button class="btn" onclick="doDeposit('stars')">⭐ Telegram Stars</button>
    </div>
  `;
}
function setDep(v){ $('depAmount').value=v; }
async function doDeposit(method, asset){
  const amount = parseInt($('depAmount').value); if(!amount||amount<10){ showToast('Введите сумму от 10 ₽'); return; }
  try {
    const res = await api('/deposit', 'POST', { method, amount, asset });
    if (res.payment_url) {
      if (method==='stars') tg.openInvoice(res.payment_url, (status)=>{ if(status==='paid'){ showToast('Оплачено'); loadMe(); }});
      else if (res.payment_url.startsWith('https://t.me/')) tg.openTelegramLink(res.payment_url);
      else tg.openLink(res.payment_url, {try_instant_view: false});
    } else { showToast(res.error||'Не удалось создать платёж'); }
  } catch(e){ showToast(e.message||'Ошибка'); }
}

function renderRefs(main){
  $('pageTitle').textContent = 'Рефералы';
  const u = state.user || {};
  const bot = state.config.bot_username || 'your_bot';
  const link = `https://t.me/${bot}?start=${u.referral_code||''}`;
  main.innerHTML = `
    <div class="card" style="text-align:center;">
      <div class="card-title">Твоя реферальная ссылка</div>
      <div class="code-block" onclick="copy('${link}')">${link}</div>
      <button class="btn" onclick="copy('${link}')">Скопировать ссылку</button>
    </div>
    <div class="card">
      <div class="card-title">Статистика</div>
      <p>Рефералов 1 уровня: <b>${state.referrals.level1_count||0}</b></p>
      <p>Рефералов 2 уровня: <b>${state.referrals.level2_count||0}</b></p>
      <p>Заработано: <b>${fmtMoney(state.referrals.earnings||0)} ₽</b></p>
    </div>
  `;
}

function renderProfile(main){
  $('pageTitle').textContent = 'Профиль';
  const u = state.user || {};
  main.innerHTML = `
    <div class="card">
      <div class="card-title">Пользователь</div>
      <p>ID: <code>${u.user_id||''}</code></p>
      <p>Баланс: <b>${fmtMoney(u.balance||0)} ₽</b></p>
      <p>Всего потрачено: <b>${fmtMoney(u.total_spent||0)} ₽</b></p>
      <p>Куплено месяцев: <b>${u.total_months||0}</b></p>
      <p>Пробный период: <b>${u.trial_used?'использован':'не использован'}</b></p>
    </div>
    <button class="btn" onclick="openSupport()">Написать в поддержку</button>
    ${state.isAdmin?`<button class="btn btn-outline" onclick="render('admin')">Админ-панель</button>`:''}
  `;
}

async function renderAdmin(main){
  $('pageTitle').textContent = 'Админ';
  try {
    const data = await api('/metrics');
    main.innerHTML = `
      <div class="card"><div class="card-title">Метрики</div>
        <p>Пользователей: <b>${data.users_total}</b></p>
        <p>Активных подписок: <b>${data.subscriptions_active}</b></p>
        <p>MRR: <b>${fmtMoney(data.mrr_rub)} ₽</b></p>
        <p>Выручка: <b>${fmtMoney(data.revenue_total_rub)} ₽</b></p>
        <p>Онлайн: <b>${data.online_now}</b></p>
      </div>
    `;
  } catch(e){ main.innerHTML = '<div class="empty">Нет доступа</div>'; }
}

function openSupport(){
  const s = state.config.support || state.config.support_id;
  if (!s) { showToast('Поддержка не настроена'); return; }
  if (/^\d+$/.test(s)) tg.openTelegramLink('tg://user?id=' + s);
  else if (s.startsWith('@')) tg.openTelegramLink('https://t.me/' + s.slice(1));
  else if (s.startsWith('http://') || s.startsWith('https://')) tg.openTelegramLink(s);
  else tg.openTelegramLink('https://t.me/' + s);
}

async function loadMe(){
  try {
    const data = await api('/me');
    state.user = data.user;
    state.subscriptions = data.subscriptions;
    state.plans = data.plans;
    state.referrals = data.referrals;
    state.isAdmin = data.is_admin;
  } catch(e){ console.error(e); render('auth-error'); throw e; }
}

async function loadConfig(){
  try { state.config = await api('/config'); } catch(e){ state.config = {}; }
}

async function init(){
  await loadConfig();
  await loadMe();
  render('home', false);
  $('backBtn').onclick = ()=>{ state.stack.pop(); const prev = state.stack.pop() || 'home'; render(prev, false); };
  document.querySelectorAll('.bottom-nav button').forEach(b=>{
    b.onclick = ()=>{ state.stack=[]; render(b.dataset.page, false); };
  });
}

init().catch(()=>{ $('main').innerHTML = '<div class="empty">Ошибка загрузки. Попробуйте позже.</div>'; });
</script>
</body>
</html>
